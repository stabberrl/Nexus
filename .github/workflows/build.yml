name: Build Nexus AI .exe

on:
  workflow_dispatch:
  push:
    branches: [malachite-lava]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nexus-desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-windows
          path: apps/nexus-desktop/src-tauri/target/release/nexus-desktop.exe
          if-no-files-found: error
