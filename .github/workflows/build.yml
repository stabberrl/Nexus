name: Build Nexus AI .exe

on:
  workflow_dispatch:
  push:
    branches: [malachite-lava]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nexus-desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: Debug - list icon files
        shell: pwsh
        run: |
          echo "=== Current directory ==="
          Get-Location
          echo "=== src-tauri/icons contents ==="
          Get-ChildItem -Path src-tauri/icons -Recurse
          echo "=== tauri.conf.json ==="
          Get-Content src-tauri/tauri.conf.json

      - name: Generate icons with Tauri CLI (fallback)
        run: npx tauri icon src-tauri/icons/icon.png
        continue-on-error: true

      - name: Debug - list icon files after generation
        shell: pwsh
        run: |
          echo "=== src-tauri/icons after tauri icon ==="
          Get-ChildItem -Path src-tauri/icons -Recurse
          echo "=== File sizes ==="
          Get-ChildItem -Path src-tauri/icons | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Build Tauri app
        run: npm run tauri build

      - name: Prepare release bundle
        shell: pwsh
        run: |
          $bundle = "nexus-ai-windows"
          New-Item -ItemType Directory -Path $bundle -Force
          Copy-Item "src-tauri/target/release/nexus-desktop.exe" -Destination $bundle
          Copy-Item -Recurse "${{ github.workspace }}/backend" -Destination "$bundle/backend"
          Copy-Item "${{ github.workspace }}/backend/requirements.txt" -Destination "$bundle/"
          echo "=== Bundle contents ==="
          Get-ChildItem -Path $bundle -Recurse

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-windows
          path: apps/nexus-desktop/nexus-ai-windows
          if-no-files-found: error
